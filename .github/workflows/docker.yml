name: Test and build image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled, so a release on master is never cut off between image and tag.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # a hanging test (a forgotten fake, a task left waiting) fails instead of running 6 h
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uvx ruff check app tests --select F,E9,B --ignore B008
      - name: Tests
        run: uv run --no-sync pytest -q

  # On a push to master: the version in pyproject.toml is a new release if there is no tag v<version> yet.
  version:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          app=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+?)\"", open("app/__init__.py").read())[1])')
          if [ "$app" != "$version" ]; then
            echo "::error::pyproject.toml says $version, app/__init__.py says $app: bump both."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "Tag v$version already exists, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ $? -eq 2 ]; then
            echo "New version $version, releasing as v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

  # The image is built for pull requests (build only, nothing pushed), for pushes to master that raise the
  # version, and for tags v* pushed by hand (both pushed); any other push to master only runs the tests.
  image:
    needs: [test, version]
    if: >-
      !cancelled() && needs.test.result == 'success' && (
        github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.release == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/secondhandler
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=sha,format=short

      # the image must start and answer before anything is pushed as :latest (a missing package, a broken entrypoint
      # passed the tests and reached every pull)
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: secondhandler:smoke
          cache-from: type=gha

      - name: Smoke test (the app starts and answers /healthz)
        run: |
          docker run -d --name smoke -p 8000:8000 -e BROWSER_ENABLED=0 secondhandler:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz; then echo; docker rm -f smoke > /dev/null; exit 0; fi
            sleep 2
          done
          docker logs smoke 2>&1 | tail -80
          exit 1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tag the release once its image is pushed. A tag pushed with GITHUB_TOKEN doesn't start another run,
  # so the image isn't built twice.
  tag:
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tag v${{ needs.version.outputs.version }}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Version $VERSION"
          git push origin "v$VERSION"

  # A GitHub release for every version tag that has none: the tag above (a raised version on master) or a tag v*
  # pushed by hand (after its image). Any other push to master checks the current version's tag too, so a release
  # that failed once (or v0.2.4, tagged before releases existed) is made up for. Notes: the version's section of
  # CHANGELOG.md ("## SecondHandler <version>" up to the next one; its pictures in docs/releases/v<version>/, linked at
  # the tag), for tags before the changelog the file docs/releases/v<version>.md, with the commits folded below; else
  # the commits since the previous version. Then the image to pull and the compare link.
  release:
    needs: [version, image, tag]
    if: >-
      !cancelled() && github.event_name == 'push' && (
        (startsWith(github.ref, 'refs/tags/v') && needs.image.result == 'success') ||
        (github.ref_type == 'branch' && needs.version.result == 'success' && needs.tag.result != 'failure'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/secondhandler
          REPO: ${{ github.repository }}
          COMPARE: ${{ github.server_url }}/${{ github.repository }}/compare
        run: |
          git fetch --tags --force --quiet
          if ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "No tag $TAG (yet), nothing to release."
            exit 0
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists."
            exit 0
          fi
          version=${TAG#v}
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          commits() {
            git log --no-merges --max-count=100 --invert-grep --grep='^Version [0-9.]*$' --format='- %s (%h)' \
              "${prev:+$prev..}$TAG"
          }
          # the version's section of CHANGELOG.md at the tag (its heading up to the next version's), else (tags before
          # the changelog) its own file docs/releases/<tag>.md
          # the heading is "## SecondHandler <version>" or linked to its release, "## [SecondHandler <version>](…)"
          section=$(git show "$TAG:CHANGELOG.md" 2>/dev/null | awk -v v="$version" \
            '$0 == "## SecondHandler " v || index($0, "## [SecondHandler " v "](") == 1 {on = 1; print; next}
             on && /^## / {exit} on' || true)
          written="docs/releases/$TAG.md"
          if [ -z "$section" ] && git cat-file -e "$TAG:$written" 2>/dev/null; then
            section=$(git show "$TAG:$written")
          fi
          {
            if [ -n "$section" ]; then
              # relative picture links (markdown and <img src>) point at the files as they are at the tag
              raw="https://raw.githubusercontent.com/$REPO/$TAG"
              printf '%s\n' "$section" | sed -E \
                -e "s#\]\((\./)?(docs/releases/)?(v[0-9][^)]*)\)#](${raw}/docs/releases/\3)#g" \
                -e "s#src=\"(\./)?(docs/releases/)?(v[0-9][^\"]*)\"#src=\"${raw}/docs/releases/\3\"#g"
              echo
              echo "<details><summary>All commits</summary>"
              echo
              commits
              echo
              echo "</details>"
            else
              echo "## Changes"
              echo
              commits
            fi
            echo
            echo "**Docker image:** \`$IMAGE:$version\` (also \`${version%.*}\` and \`latest\`)"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** $COMPARE/$prev...$TAG"
            fi
          } > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md

services:
  willhaben-agent:
    # Prebuilt image from GitHub Actions; `docker compose up -d` pulls it. To build from source instead,
    # run `docker compose up -d --build` in a clone of the repository.
    image: ghcr.io/lumascet/secondhandler:latest
    pull_policy: missing
    build: .
    container_name: willhaben-agent
    restart: unless-stopped
    stop_grace_period: 40s   # above supervisord's stopwaitsecs (20 s): the app closes the browser and its files cleanly
    env_file:
      - path: .env
        required: false   # all settings are optional; setup happens in the dashboard
    ports:
      - "${DASHBOARD_PORT:-8000}:8000"   # dashboard + JSON API
      - "${NOVNC_PORT:-6080}:6080"       # optional noVNC view of the login browser (set VNC_PASSWORD, LAN only)
    volumes:
      - ./data:/data  # SQLite, browser profile (= your willhaben login), uploads, captures
    shm_size: "1gb"   # Chromium needs more than the 64 MB default
    # Optional: if Home Assistant sits behind a reverse proxy this host cannot reach by its public name,
    # set PROXY_VIA (proxy container name on a shared network) and PROXY_HOSTS (space-separated hostnames);
    # the entrypoint then maps those hostnames to the proxy. Put such host-specific bits in compose.override.yaml.

[project]
name = "secondhandler"
version = "0.5.3"
description = "Self-hosted, LLM-powered agent for second-hand marketplaces (willhaben, Vinted, Kleinanzeigen and more): it searches and curates listings, estimates which one is the best deal, and handles buying and selling for you."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "playwright>=1.48",
    "patchright==1.63.0",              # Playwright without the automation traces bot protections check (Vinted)
    "mcp>=2.3",                        # MCPServer and the Streamable HTTP transport (app/mcp_http.py)
    "pypdf>=6.20.0",
    "segno>=1.6.6",
    "curl_cffi>=0.16",
    "pillow>=11",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
